      <ellipse cx="162" cy="216" rx="5.5" ry="8" transform="rotate(-18 162 216)" fill="#ecc084" opacity="0.55"/>
    </g>
    <g transform="rotate(2 210 218)">
      <path d="M 210 242 C 192.72 231.92 186 215.12 199.2 195.2 C 207.6 187.28 212.4 187.28 220.8 195.2 C 234 215.12 227.28 231.92 210 242 Z" fill="url(#gWhite)" stroke="#5c3613" stroke-width="1" stroke-opacity="0.22"/>
      <ellipse cx="202" cy="206" rx="5.5" ry="8" transform="rotate(-18 202 206)" fill="#ffffff" opacity="0.5"/>
    </g>
    <g transform="rotate(9 250 226)">
      <path d="M 250 250 C 232.72 239.92 226 223.12 239.2 203.2 C 247.6 195.28 252.4 195.28 260.8 203.2 C 274 223.12 267.28 239.92 250 250 Z" fill="url(#gBrown)" stroke="#5c3613" stroke-width="1" stroke-opacity="0.35"/>
      <ellipse cx="242" cy="214" rx="5.5" ry="8" transform="rotate(-18 242 214)" fill="#ecc084" opacity="0.55"/>
    </g>
    <g transform="rotate(15 292 236)">
      <path d="M 292 260 C 274.72 249.92 268 233.12 281.2 213.2 C 289.6 205.28 294.4 205.28 302.8 213.2 C 316 233.12 309.28 249.92 292 260 Z" fill="url(#gWhite)" stroke="#5c3613" stroke-width="1" stroke-opacity="0.22"/>
      <ellipse cx="284" cy="224" rx="5.5" ry="8" transform="rotate(-18 284 224)" fill="#ffffff" opacity="0.5"/>
