      <path d="M 158 257 C 151 302 158 344 174 369"/>
      <path d="M 190 253 C 186 302 192 348 208 373"/>
      <path d="M 222 253 C 228 302 222 348 238 373"/>
      <path d="M 254 257 C 261 302 254 344 270 369"/>
      <path d="M 286 262 C 291 300 285 340 300 362"/>
