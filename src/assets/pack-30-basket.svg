      <ellipse cx="137" cy="243" rx="6" ry="9" transform="rotate(-18 137 243)" fill="#ffffff" opacity="0.5"/>
    </g>
    <g transform="rotate(-3 190 246)">
      <path d="M 190 272 C 171.28 261.08 164 242.88 178.3 221.3 C 187.4 212.72 192.6 212.72 201.7 221.3 C 216 242.88 208.72 261.08 190 272 Z" fill="url(#gWhite)" stroke="#5c3613" stroke-width="1" stroke-opacity="0.22"/>
      <ellipse cx="181" cy="233" rx="6" ry="9" transform="rotate(-18 181 233)" fill="#ffffff" opacity="0.5"/>
    </g>
    <g transform="rotate(0 212 268)">
      <path d="M 212 294 C 193.28 283.08 186 264.88 200.3 243.3 C 209.4 234.72 214.6 234.72 223.7 243.3 C 238 264.88 230.72 283.08 212 294 Z" fill="url(#gBrown)" stroke="#5c3613" stroke-width="1" stroke-opacity="0.35"/>
      <ellipse cx="203" cy="255" rx="6" ry="9" transform="rotate(-15 203 255)" fill="#ecc084" opacity="0.55"/>
    </g>
    <g transform="rotate(8 252 248)">
      <path d="M 252 274 C 233.28 263.08 226 244.88 240.3 223.3 C 249.4 214.72 254.6 214.72 263.7 223.3 C 278 244.88 270.72 263.08 252 274 Z" fill="url(#gWhite)" stroke="#5c3613" stroke-width="1" stroke-opacity="0.22"/>
      <ellipse cx="243" cy="235" rx="6" ry="9" transform="rotate(-18 243 235)" fill="#ffffff" opacity="0.5"/>
    </g>
    <g transform="rotate(14 288 258)">
      <path d="M 288 284 C 269.28 273.08 262 254.88 276.3 233.3 C 285.4 224.72 290.6 224.72 299.7 233.3 C 314 254.88 306.72 273.08 288 284 Z" fill="url(#gBrown)" stroke="#5c3613" stroke-width="1" stroke-opacity="0.35"/>
      <ellipse cx="279" cy="245" rx="6" ry="9" transform="rotate(-15 279 245)" fill="#ecc084" opacity="0.55"/>
    </g>

    <!-- front rim band -->
    <path d="M 98 268 C 140 250 280 250 322 268 C 280 284 140 284 98 268 Z" fill="#8a5a26"/>
    <path d="M 106 269 C 148 257 272 257 314 269" fill="none" stroke="#4a2b0e" stroke-width="3" opacity="0.4"/>
    <path d="M 104 261 C 145 247 275 247 316 261" fill="none" stroke="#d9a55f" stroke-width="2.5" opacity="0.65"/>

    <!-- arched braided handle -->
    <path d="M 112 256 C 112 128 308 128 308 256" fill="none" stroke="#6e4519" stroke-width="17" stroke-linecap="round"/>
    <path d="M 112 256 C 112 128 308 128 308 256" fill="none" stroke="#b57c36" stroke-width="11" stroke-linecap="round"/>
    <path d="M 112 256 C 112 128 308 128 308 256" fill="none" stroke="#6e4519" stroke-width="4.5" stroke-dasharray="9 8" stroke-linecap="round"/>
    <path d="M 112 256 C 112 128 308 128 308 256" fill="none" stroke="#e6b571" stroke-width="2.5" opacity="0.5"/>
