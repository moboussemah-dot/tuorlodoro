      <path d="M 103 285 C 150 275 270 275 317 285"/>
      <path d="M 106 305 C 152 295 268 295 314 305"/>
      <path d="M 111 325 C 155 316 265 316 309 325"/>
      <path d="M 118 345 C 160 337 260 337 302 345"/>
