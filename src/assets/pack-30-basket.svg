<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Cesto di vimini con uova bianche e marroni">
  <defs>
    <radialGradient id="gWhite" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f7f1e6"/>
      <stop offset="100%" stop-color="#ddd1ba"/>
    </radialGradient>
    <radialGradient id="gBrown" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#d09a5a"/>
      <stop offset="55%" stop-color="#a06a2f"/>
      <stop offset="100%" stop-color="#77451d"/>
    </radialGradient>
    <linearGradient id="gBasket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c08a3e"/>
      <stop offset="45%" stop-color="#a97432"/>
      <stop offset="100%" stop-color="#7a4c1e"/>
